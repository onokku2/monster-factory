<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e0a1c">
  <title>モンスターファクトリー</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- PWA -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="モンファク">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <!-- 端末上で発生したエラーを画面に表示（iOS等の原因特定用）-->
  <script>
    window.__mfErr = function (msg) {
      try {
        var d = document.getElementById("mf-err");
        if (!d) { d = document.createElement("div"); d.id = "mf-err"; d.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#b00020;color:#fff;font:12px/1.5 monospace;padding:10px;white-space:pre-wrap;max-height:45vh;overflow:auto"; (document.body || document.documentElement).appendChild(d); d.onclick = function () { d.remove(); }; }
        d.textContent = "⚠ " + msg + "\n(タップで閉じる)";
      } catch (e) {}
    };
    window.addEventListener("error", function (e) {
      var where = e.filename ? (" @ " + e.filename.split("/").pop() + ":" + e.lineno) : "";
      window.__mfErr((e.message || (e.target && e.target.src ? "読み込み失敗: " + e.target.src.split("/").pop() : "error")) + where);
    }, true);
    window.addEventListener("unhandledrejection", function (e) {
      window.__mfErr("promise: " + ((e.reason && e.reason.message) || e.reason || "rejected"));
    });
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="toasts"></div>

  <!-- 依存順にロード（素のJS / MF名前空間） -->
  <script src="js/rng.js"></script>
  <script src="js/config.js"></script>
  <script src="js/parts.js"></script>
  <script src="js/names.js"></script>
  <script src="js/sprite.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/skills.js"></script>
  <script src="js/species.js"></script>
  <script src="js/monster.js"></script>
  <script src="js/evolution.js"></script>
  <script src="js/stages.js"></script>
  <script src="js/training.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/save.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>

  <!-- Service Worker 登録（https/localhost のみ動作）-->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      });
    }
  </script>
</body>
</html>
